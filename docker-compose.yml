services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: pixelaition
      POSTGRES_PASSWORD: pixelaition
      POSTGRES_DB: pixelaition
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pixelaition -d pixelaition"]
      interval: 5s
      timeout: 5s
      retries: 20

  migrate:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pixelaition:pixelaition@db:5432/pixelaition
    command: ["pnpm", "--filter", "@pixelaition/db", "migrate"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  api:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pixelaition:pixelaition@db:5432/pixelaition
      API_PORT: 3001
      WORKER_INTERNAL_URL: http://worker:4002
      BETTER_AUTH_URL: http://localhost:3000
    command: ["pnpm", "--filter", "@pixelaition/api", "start"]
    ports:
      - "3001:3001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  worker:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql://pixelaition:pixelaition@db:5432/pixelaition
      WORKER_PORT: 4002
      DURABLE_DATABASE_PATH: /data/anvia-runs.sqlite
    command: ["pnpm", "--filter", "@pixelaition/worker", "start"]
    volumes:
      - durable-data:/data
    depends_on:
      migrate:
        condition: service_completed_successfully
    deploy:
      replicas: 1
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:4002/health').then((r)=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:80"
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres-data:
  durable-data:
