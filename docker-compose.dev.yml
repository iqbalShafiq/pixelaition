services:
  api:
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    command: ["pnpm", "--filter", "@pixelaition/api", "dev"]
  worker:
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
      - durable-data:/data
    command: ["pnpm", "--filter", "@pixelaition/worker", "dev"]
  web:
    build:
      context: .
      dockerfile: docker/node.Dockerfile
    volumes:
      - ./apps:/app/apps
      - ./packages:/app/packages
    command:
      [
        "pnpm",
        "--filter",
        "@pixelaition/web",
        "dev",
        "--host",
        "0.0.0.0",
        "--port",
        "3000",
      ]
    ports:
      - "3000:3000"
